name: Build Multi Roblox Manager

on:
  push:
    paths:
      - "KrakenHubMultiRoblox/**"
      - ".github/workflows/build-multi-roblox.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore KrakenHubMultiRoblox/KrakenHubMultiRoblox.csproj

      - name: Build
        run: dotnet build KrakenHubMultiRoblox/KrakenHubMultiRoblox.csproj -c Release --no-restore -p:Platform=x64

      - name: Publish EXE
        run: dotnet publish KrakenHubMultiRoblox/KrakenHubMultiRoblox.csproj -c Release -r win-x64 --self-contained true --no-restore -p:Platform=x64 -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false -o publish

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: MultiRobloxManager-win-x64
          path: publish/*.exe
